# Kitty terminal configuration
# Beautiful dark theme with subtle transparency

shell /usr/bin/fish

# Font
font_family      JetBrains Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.0

# Cursor
cursor_shape     beam
cursor_blink_interval 0.5
cursor_stop_blinking_after 15.0

# Scrollback
scrollback_lines 10000
wheel_scroll_multiplier 5.0

# Mouse
mouse_hide_wait 3.0
url_color #89b4fa
url_style curly

# Performance
repaint_delay 10
input_delay 3
sync_to_monitor yes

# Bell
enable_audio_bell no
visual_bell_duration 0.0
bell_on_tab yes

# Window
remember_window_size  yes
initial_window_width  900
initial_window_height 600
window_padding_width 8
window_margin_width 0
window_border_width 0
draw_minimal_borders yes
window_step_width 0.02
window_step_height 0.02

# Transparency & Blur
#background_opacity 0.92
#background_blur 1
#dynamic_background_opacity yes

# Tab bar
tab_bar_edge top
tab_bar_style powerline
tab_powerline_style slanted
tab_title_template "{index}: {title}"
active_tab_foreground   #1a1b26
active_tab_background   #7aa2f7
inactive_tab_foreground #565f89
inactive_tab_background #1a1b26

# Color scheme - Tokyo Night inspired
foreground              #c0caf5
background              #1a1b26
selection_foreground    #c0caf5
selection_background    #33467c

# Cursor colors
cursor                  #c0caf5
cursor_text_color       #1a1b26

# URL underline
url_color               #7aa2f7

# OS window titlebar
titlebar_color          #1a1b26
hide_window_decorations yes

# Normal colors
color0  #15161e
color8  #414868
color1  #f7768e
color9  #ff7a93
color2  #9ece6a
color10 #b9f27c
color3  #e0af68
color11 #ff9e64
color4  #7aa2f7
color12 #7dcfff
color5  #bb9af7
color13 #bb9af7
color6  #7dcfff
color14  #7dcfff
color7  #a9b1d6
color15  #c0caf5

# Dim colors
dim_opacity 0.75

# Shell integration
shell_integration enabled

# Confirm OS window close
confirm_os_window_close 0
