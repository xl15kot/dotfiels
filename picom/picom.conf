# ════════════════════════════════════════════════════════════
#  picom v13 — только слайд, без fade (окна не исчезают)
#  Окна влетают/уезжают вправо за край экрана, прозрачность всегда 1.0.
# ════════════════════════════════════════════════════════════

# ─── Рендер ─────────────────────────────────────────────────
backend = "glx";
vsync = true;
use-damage = true;
unredir-if-possible = true;
log-level = "warn";

shadow = false;
blur-background = false;

corner-radius = 6;          # если вязнет — поставь 0

# ─── Анимации: чистый слайд ─────────────────────────────────
animations = (
    # Открытие/появление: влетает справа от края монитора
    {
        triggers = [ "open", "show" ];
        offset-x = {
            curve    = "cubic-bezier(0.22, 1, 0.36, 1)";
            duration = 0.2;
            start    = "window-monitor-x + window-monitor-width - window-x";
            end      = 0;
        };
    },

    # Закрытие/сворачивание: уезжает вправо за край монитора.
    # Кривая ease-IN: стартует медленно и разгоняется наружу — иначе
    # слайд не видно глазами. opacity 1.0 — константа, НЕ fade:
    # без неё picom спрятал бы окно сразу (по умолчанию opacity = 0).
    {
        triggers = [ "close", "hide" ];
        offset-x = {
            curve    = "cubic-bezier(0.55, 0, 1, 0.45)";   # ease-in
            duration = 0.22;
            start    = 0;
            end      = "window-monitor-x + window-monitor-width - window-x";
        };
        opacity = {
            duration = 0.22;
            start    = 1.0;
            end      = 1.0;
        };
    }
);

# ─── Правила окон ───────────────────────────────────────────
rules = (
    # Фуллскрин — без скруглений и без слайда (иначе полноэкранное
    # окно будет перерисовывать полэкрана при открытии)
    {
        match         = "fullscreen";
        corner-radius = 0;
        animations    = ( { triggers = [ "open", "close", "show", "hide" ]; } );
    },

    # Панели/док/рабочий стол — статичны, без анимаций
    {
        match         = "window_type = 'dock' || window_type = 'desktop'";
        corner-radius = 0;
        animations    = ( { triggers = [ "open", "close", "show", "hide" ]; } );
    },

    # Меню/тултипы/уведомления и вообще все transient-попапы
    # (override-redirect: карточки вкладок браузера, тултипы, всплывашки
    # по средней кнопке и т.п.) — привязаны к курсору, слайдить их не
    # надо: показываются мгновенно
    {
        match      = "override_redirect || window_type = 'menu' || window_type = 'dropdown_menu' || window_type = 'popup_menu' || window_type = 'tooltip' || window_type = 'combo' || window_type = 'notification'";
        animations = ( { triggers = [ "open", "close", "show", "hide" ]; } );
    },

    # Rofi: влетает снизу от нижнего края монитора, при закрытии
    # уезжает обратно вниз
    {
        match = "class_i = 'rofi' || class_g = 'Rofi'";
        animations = (
            {
                triggers = [ "open", "show" ];
                offset-y = {
                    curve    = "cubic-bezier(0.22, 1, 0.36, 1)";   # ease-out
                    duration = 0.2;
                    start    = "window-monitor-y + window-monitor-height - (window-y + window-height)";
                    end      = 0;
                };
            },
            {
                triggers = [ "close", "hide" ];
                offset-y = {
                    curve    = "cubic-bezier(0.55, 0, 1, 0.45)";   # ease-in
                    duration = 0.2;
                    start    = 0;
                    end      = "window-monitor-y + window-monitor-height - (window-y + window-height)";
                };
                opacity = {
                    duration = 0.2;
                    start    = 1.0;
                    end      = 1.0;
                };
            }
        );
    }
);
